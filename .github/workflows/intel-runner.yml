name: Intel runner

# Runs on the owner's self-hosted runner "Intel" (labels self-hosted, Linux, X64, Intel). Started by hand (Actions -> Intel runner ->
# Run workflow) or by a push to the branch ci/intel-runner. There is NO pull_request trigger on purpose: this repo is public, and a
# self-hosted runner must never run code from someone else's pull request.
# Stage 1 prints what the machine has (CPU, RAM, disk, GPU, oneAPI, Docker);
# Stage 2 (`b70-gpu`) validates real Intel Arc Pro B70 (Battlemage G31 / bmg_g31) GPU hardware, native bmg_g31 SG16 XMX & Qwen SYCL
# parity tests, `ghcr.io/niko1221/strata:0.2.19-sycl` Docker GPU execution, live v0.2.19 `install.sh` + signed SYCL release packages
# (`strata-engine`, `strata-hy4`, `strata-inkling`), live `Inkling-2-Mini-SQ-10.strata` + Vision + `.gguf` on B70, and `Hy4-Flash-Vision.strata` ViT inference;
# Stage 3 (`checks`) runs the same fast checks as check.yml's Linux jobs.

on:
  workflow_dispatch:
  push:
    branches: [ci/intel-runner]

permissions:
  contents: read

concurrency:
  group: intel-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  info:
    name: Machine info
    runs-on: [self-hosted, Linux, X64, Intel]
    timeout-minutes: 15
    steps:
      - name: System, CPU, memory, disk, GPU
        run: |
          set +e
          echo "== host";   hostname; uname -a; head -4 /etc/os-release
          echo "== cpu";    nproc; lscpu | grep -E 'Model name|Socket|Core|Thread|NUMA node\(s\)'
          echo "== isa";    grep -o -w -E 'avx2|avx512f|avx512_vnni|avx_vnni|amx_tile' /proc/cpuinfo | sort | uniq -c
          echo "== memory"; free -g
          echo "== disk";   df -h "$GITHUB_WORKSPACE" /tmp
          echo "== gpu";    lspci -nn 2>/dev/null | grep -i -E 'vga|display|3d'
          ls -l /dev/dri 2>/dev/null
          for c in /sys/class/drm/card*/device; do
            [ -f "$c/vendor" ] && echo "  $c: vendor=$(cat "$c/vendor") device=$(cat "$c/device" 2>/dev/null)"
          done
          command -v xpu-smi && xpu-smi discovery
          command -v sycl-ls && sycl-ls
          command -v clinfo && clinfo -l
          echo "== oneapi"; ls /opt/intel/oneapi 2>/dev/null
          command -v ocloc && ocloc --version
          command -v docker && docker --version
          echo "== tools";  python3 --version; cmake --version | head -1; gcc --version | head -1; ninja --version; git --version
          echo "== runner"; echo "user $(id -un) groups $(id -Gn)"; echo "workspace $GITHUB_WORKSPACE"; ulimit -l

  b70-gpu:
    name: Intel Arc Pro B70 GPU & Docker
    needs: info
    runs-on: [self-hosted, Linux, X64, Intel]
    timeout-minutes: 55
    env:
      NODE_OPTIONS: --use-system-ca
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 1. Hardware, PCI ID, SYCL & Strata GPU detection on Arc Pro B70
        run: |
          set -euo pipefail
          set +u
          [ -f /opt/intel/oneapi/setvars.sh ] && source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          set -u
          echo "== PCI & DRM =="
          lspci -nn | grep -i -E 'vga|display|3d'
          for c in /sys/class/drm/card*/device; do
            [ -f "$c/vendor" ] && echo "  $c: vendor=$(cat "$c/vendor") device=$(cat "$c/device" 2>/dev/null)"
          done
          echo "== sycl-ls =="
          command -v sycl-ls >/dev/null && sycl-ls || echo "(sycl-ls not on PATH)"
          echo "== ocloc =="
          if command -v ocloc >/dev/null; then
            ocloc --version || true
            ocloc ids bmg_g31 || true
          fi
          echo "== Strata host & GPU detection =="
          PYTHONPATH="$PWD/terminal" python3 - <<'PY'
          import json
          from strata_control import engine_component as ec
          from tools.strata_mcp import Strata
          plat = ec.host_platform()
          backend, how = ec.detect_backend()
          hw = Strata().hardware(fresh=True)
          print("host_platform:", plat, "detect_backend:", backend, how)
          print("Strata.hardware:", json.dumps(hw, default=str))
          assert plat == "linux-x86_64", f"unexpected platform: {plat}"
          assert backend == "sycl", f"expected sycl backend on Arc Pro B70, got {backend} ({how})"
          gpus = hw.get("gpus") or []
          intel_gpus = [g for g in gpus if "intel" in (g.get("vendor") or g.get("name") or "").lower()]
          assert intel_gpus, f"no Intel GPU detected by Strata().hardware(): {hw}"
          print("STRATA_B70_DETECT_OK:", intel_gpus)
          PY

      - name: 2. Native bmg_g31 SG16 XMX SYCL GPU tests on Arc Pro B70 (sy_probe, sy_ktest, sy_mla_test)
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          unset OMP_PLACES OMP_PROC_BIND GOMP_CPU_AFFINITY KMP_AFFINITY
          set -u

          BUILD="$RUNNER_TEMP/b70-build"
          OBJ="$BUILD/obj"
          mkdir -p "$OBJ/zstd"
          R="$PWD/engine"
          H="$R/src/hy4flash"
          Z="$R/third_party/zstd-dec"
          INC="-I$R/include -I$H/sycl -I$H/run -I$R/third_party/stb -I$Z"

          if command -v ocloc >/dev/null 2>&1 && ocloc ids bmg_g31 >/dev/null 2>&1; then
            SYCL_TGT="-fsycl-targets=intel_gpu_bmg_g31,spir64"
          else
            SYCL_TGT="-fsycl-targets=spir64"
          fi
          BMG_FLAGS="-fsycl $SYCL_TGT -DHY4S_DISABLE_SG8 -DHY4S_ENABLE_SG16_XMX"
          MKL_FLAGS=""
          MKL_LIBS=""
          if [ -n "${MKLROOT:-}" ] && [ -f "$MKLROOT/include/oneapi/mkl/blas.hpp" ]; then
            MKL_FLAGS="-DHY4S_USE_ONEMKL -I$MKLROOT/include"
            MKL_LIBS="-L$MKLROOT/lib -Wl,-rpath,$MKLROOT/lib -lmkl_sycl_blas -lmkl_intel_lp64 -lmkl_sequential -lmkl_core"
          fi
          echo "icpx=$(icpx --version | head -1)"
          echo "BMG_FLAGS=$BMG_FLAGS MKL=$([ -n "$MKL_FLAGS" ] && echo ON || echo OFF)"

          for f in \
            "$Z/common/debug.c" "$Z/common/entropy_common.c" "$Z/common/error_private.c" \
            "$Z/common/fse_decompress.c" "$Z/common/zstd_common.c" "$Z/common/xxhash.c" \
            "$Z/decompress/huf_decompress.c" "$Z/decompress/zstd_ddict.c" \
            "$Z/decompress/zstd_decompress.c" "$Z/decompress/zstd_decompress_block.c"; do
            b="$(basename "$f" .c)"
            gcc -O2 -fPIC -DZSTD_DISABLE_ASM=1 -DXXH_NAMESPACE=ZSTD_ -I"$Z" -I"$Z/common" -I"$Z/decompress" -c "$f" -o "$OBJ/zstd/$b.o"
          done
          g++ -O3 -std=c++17 -fPIC $INC -c "$R/src/artifact/strata_reader.cpp" -o "$OBJ/strata_reader.o"
          g++ -O3 -std=c++17 -fPIC $INC -c "$R/src/quant/sk_codecs.cpp" -o "$OBJ/sk_codecs.o"

          echo "== Compile sy_probe, sy_ktest, sy_mla_test, sy_vit_test in parallel =="
          icpx -O3 -g -std=c++17 -Wno-deprecated-declarations $BMG_FLAGS $INC \
            "$H/sycl/sy_probe.cpp" -lpthread -lm -o "$BUILD/sy_probe" &
          P1=$!
          icpx -O3 -g -std=c++17 -fiopenmp -Wno-deprecated-declarations $BMG_FLAGS $MKL_FLAGS $INC \
            "$H/sycl/sy_ktest.cpp" "$OBJ/sk_codecs.o" $MKL_LIBS -lpthread -lm -o "$BUILD/sy_ktest" &
          P2=$!
          icpx -O3 -g -std=c++17 -fiopenmp -Wno-deprecated-declarations $BMG_FLAGS $MKL_FLAGS $INC \
            "$H/sycl/sy_mla_test.cpp" "$H/sycl/sy_mla.cpp" "$OBJ/sk_codecs.o" $MKL_LIBS -lpthread -lm -o "$BUILD/sy_mla_test" &
          P3=$!
          icpx -O3 -std=c++17 -Wno-deprecated-declarations $BMG_FLAGS $MKL_FLAGS $INC \
            "$H/sycl/sy_vit_test.cpp" "$OBJ/strata_reader.o" "$OBJ/sk_codecs.o" "$OBJ/zstd/"*.o \
            $MKL_LIBS -lpthread -lm -o "$BUILD/sy_vit_test" &
          P4=$!
          wait "$P1" "$P2" "$P3" "$P4"

          export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
          fail=0
          run_diag() {
            local label="$1"; shift
            echo "== $label =="
            set +e
            stdbuf -oL -eL "$@"
            local rc=$?
            set -e
            echo "--> $label rc=$rc"
            if [ "$rc" -ne 0 ]; then
              fail=1
              if [ "$rc" -ge 128 ] && command -v gdb >/dev/null 2>&1; then
                echo "--> gdb backtrace for $label"
                gdb -batch -ex run -ex "thread apply all bt 20" --args "$@" 2>&1 | tail -80 || true
              fi
            fi
          }

          run_diag "sy_probe (Level Zero B70)" "$BUILD/sy_probe"
          run_diag "sy_ktest HY4S_ONEMKL=0 (native SG16 XMX B70)" env HY4S_ONEMKL=0 "$BUILD/sy_ktest"
          run_diag "sy_ktest HY4S_ONEMKL=0 HY4S_NO_XMX=1 (SG32 SIMT fallback B70)" env HY4S_ONEMKL=0 HY4S_NO_XMX=1 "$BUILD/sy_ktest"
          echo "== Diagnostic: oneMKL on B70 across L0-V2 / L0-V1 / OpenCL =="
          for mode in "L0-V2:level_zero:gpu:1" "L0-V1:level_zero:gpu:0" "OpenCL:opencl:gpu:0"; do
            lbl="${mode%%:*}"; rest="${mode#*:}"; sel="${rest%:*}"; v2="${rest##*:}"
            set +e
            ONEAPI_DEVICE_SELECTOR="$sel" UR_LOADER_USE_LEVEL_ZERO_V2="$v2" HY4S_ONEMKL=1 stdbuf -oL -eL "$BUILD/sy_ktest" | tail -10
            echo "--> sy_ktest oneMKL ($lbl) rc=${PIPESTATUS[0]}"
            set -e
          done
          run_diag "sy_mla_test (Flash-MLA + quant_kvb B70)" "$BUILD/sy_mla_test"
          exit "$fail"

      - name: 3. Core Qwen3.8 SYCL GPU parity self-tests on Arc Pro B70 (engine/sycl)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          set -u
          QBUILD="$RUNNER_TEMP/b70-build/qwen-sycl"
          cmake -S engine/sycl -B "$QBUILD" -G Ninja \
            -DCMAKE_CXX_COMPILER=icpx \
            -DSTRATA_SYCL_PARITY=ON
          cmake --build "$QBUILD" -j"$(nproc)" --target \
            dequant_s2_parity s2_gemv_parity router_top10_parity rope_parity kv_q8_parity
          export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
          ctest --test-dir "$QBUILD" --output-on-failure \
            -R '^(dequant_s2_parity|s2_gemv_parity|router_top10_parity|rope_parity|kv_q8_parity)$'

      - name: 4. Live ghcr.io/niko1221/strata:0.2.19-sycl Docker image & GPU compute check on Arc Pro B70
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/niko1221/strata:0.2.19-sycl"
          docker --version
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'id={{.Id}} size={{.Size}} version={{index .Config.Labels "org.opencontainers.image.version"}} flavor={{index .Config.Labels "com.strata.flavor"}}'

          RENDER_GID="$(stat -c '%g' /dev/dri/renderD128)"
          VIDEO_GID="$(stat -c '%g' /dev/dri/card0)"
          docker run --rm \
            --device /dev/dri \
            --group-add "$RENDER_GID" --group-add "$VIDEO_GID" \
            -v "$RUNNER_TEMP/b70-build:/probe:ro" \
            --entrypoint bash \
            "$IMAGE" -c '
              set -euo pipefail
              echo "== Container Terminal & Engines =="
              /opt/strata/terminal/bin/strata --version
              ENG="$(ls -d /opt/strata/components/engine/*-sycl | head -1)"
              HY4="$(ls -d /opt/strata/components/shapes/hy4/engine/*-sycl | head -1)"
              INK="$(ls -d /opt/strata/components/shapes/inkling2/engine/*-sycl | head -1)"
              echo "ENG=$ENG"
              echo "HY4=$HY4"
              echo "INK=$INK"
              "$ENG/strata" --version
              "$ENG/strata" --geometry
              "$HY4/strata-hy4" --version
              HY4S_ARCH=bmg "$HY4/strata-hy4" --version
              "$INK/strata-inkling" --version
              echo "== Level Zero B70 probe inside container =="
              /opt/strata/terminal/python/bin/python3 -c "import ctypes; ze = ctypes.CDLL(\"libze_loader.so.1\"); assert ze.zeInit(0) == 0, \"zeInit failed\"; n = ctypes.c_uint32(0); assert ze.zeDriverGet(ctypes.byref(n), None) == 0 and n.value >= 1; drivers = (ctypes.c_void_p * n.value)(); assert ze.zeDriverGet(ctypes.byref(n), drivers) == 0; nd = ctypes.c_uint32(0); assert ze.zeDeviceGet(drivers[0], ctypes.byref(nd), None) == 0 and nd.value >= 1; print(f\"Level Zero inside container OK: drivers={n.value} devices={nd.value}\")"
              echo "== Real SYCL GPU kernel execution (sy_probe + sy_ktest) inside container using bundled oneAPI 2026.1 libs =="
              ONEAPI_DEVICE_SELECTOR=level_zero:gpu LD_LIBRARY_PATH="$HY4" /probe/sy_probe
              set +e
              ONEAPI_DEVICE_SELECTOR=level_zero:gpu LD_LIBRARY_PATH="$HY4" HY4S_ONEMKL=0 /probe/sy_ktest | tail -6
              echo "container sy_ktest ONEMKL=0 rc=${PIPESTATUS[0]}"
              ONEAPI_DEVICE_SELECTOR=level_zero:gpu LD_LIBRARY_PATH="$HY4" HY4S_ONEMKL=1 /probe/sy_ktest | tail -6
              echo "container sy_ktest ONEMKL=1 rc=${PIPESTATUS[0]}"
              set -e
            '

      - name: 5. Live v0.2.19 install.sh, signed SYCL release packages, Inkling-2-Mini (.strata + .gguf) & Hy4-Flash-Vision B70 GPU tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          set +u
          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1 || true
          set -u
          SANDBOX="$RUNNER_TEMP/live-b70"
          BUILD="$RUNNER_TEMP/b70-build"
          mkdir -p "$SANDBOX/home" "$SANDBOX/data" "$SANDBOX/bin" "$SANDBOX/pkgs" "$SANDBOX/vit-out"
          export HOME="$SANDBOX/home"
          export XDG_DATA_HOME="$SANDBOX/xdg-data"
          export XDG_CONFIG_HOME="$SANDBOX/xdg-config"
          export XDG_STATE_HOME="$SANDBOX/xdg-state"
          export STRATA_DATA_DIR="$SANDBOX/data"
          export STRATA_BIN_DIR="$SANDBOX/bin"

          echo "== Run live install.sh from releases/latest =="
          curl -fsSL --connect-timeout 20 --max-time 120 \
            https://github.com/Niko1221/Strata/releases/latest/download/install.sh \
            -o "$SANDBOX/install.sh"
          sh "$SANDBOX/install.sh"
          "$SANDBOX/bin/strata" --version

          echo "== Fetch & cryptographically verify live v0.2.19 SYCL packages (strata-engine + strata-hy4 + strata-inkling) =="
          STRATA_PY="$(ls "$SANDBOX"/data/terminal/*/python/bin/python3 | head -1)"
          test -x "$STRATA_PY"
          "$STRATA_PY" tools/docker/fetch-engines.py \
            --release-tag v0.2.19 --flavors sycl --out "$SANDBOX/pkgs" > "$SANDBOX/fetch.out"
          cat "$SANDBOX/fetch.out"
          LINE="$(tail -1 "$SANDBOX/fetch.out")"
          ENG_DIR="$(printf '%s\n' "$LINE" | cut -f3)"
          HY4_DIR="$(printf '%s\n' "$LINE" | cut -f4)"
          INK_DIR="$(printf '%s\n' "$LINE" | cut -f5)"
          test -d "$ENG_DIR"
          test -d "$HY4_DIR"
          test -d "$INK_DIR"

          "$STRATA_PY" tools/packaging/package_engine.py --verify "$ENG_DIR"
          "$STRATA_PY" tools/packaging/binary_deps.py "$ENG_DIR"
          "$STRATA_PY" tools/packaging/package_engine.py --verify "$HY4_DIR"
          "$STRATA_PY" tools/packaging/binary_deps.py "$HY4_DIR"
          "$STRATA_PY" tools/packaging/package_engine.py --verify "$INK_DIR"
          "$STRATA_PY" tools/packaging/binary_deps.py "$INK_DIR"

          echo "== Clean-env execution & B70 dispatcher verification =="
          env -i "$ENG_DIR/strata" --version
          env -i "$ENG_DIR/strata" --geometry
          env -i "$HY4_DIR/strata-hy4" --version
          env -i HY4S_ARCH=bmg "$HY4_DIR/strata-hy4" --version
          env -i "$INK_DIR/strata-inkling" --version
          if command -v strace >/dev/null 2>&1; then
            strace -f -e trace=execve "$HY4_DIR/strata-hy4" --version 2>&1 | tee "$SANDBOX/dispatch.trace"
            grep -q 'strata-hy4-bmg' "$SANDBOX/dispatch.trace"
          fi

          echo "== Live Inkling-2-Mini-SQ-10.strata + Vision on Arc Pro B70 32 GB =="
          SQ10="$SANDBOX/Inkling-2-Mini-SQ-10.strata"
          INK_VIS="$SANDBOX/Inkling-2-Mini-Vision.strata"
          curl -fsSL --connect-timeout 20 --speed-limit 1 --speed-time 60 --retry 2 \
            "https://huggingface.co/strata-engine/Inkling-2-Mini-Strata/resolve/main/Inkling-2-Mini-SQ-10.strata" \
            -o "$SQ10"
          curl -fsSL --connect-timeout 20 --speed-limit 1 --speed-time 60 --retry 2 \
            "https://huggingface.co/strata-engine/Inkling-2-Mini-Strata/resolve/main/Inkling-2-Mini-Vision.strata" \
            -o "$INK_VIS"
          ls -lh "$SQ10" "$INK_VIS"
          "$INK_DIR/strata-inkling" --info "$SQ10" --vision "$INK_VIS"
          ONEAPI_DEVICE_SELECTOR=level_zero:gpu stdbuf -oL -eL "$INK_DIR/strata-inkling" --selfcheck --native "$SQ10"
          ONEAPI_DEVICE_SELECTOR=level_zero:gpu stdbuf -oL -eL "$INK_DIR/strata-inkling" --bench --native "$SQ10" --parallel 1 --prompt-len 64 --gen 32
          ONEAPI_DEVICE_SELECTOR=level_zero:gpu stdbuf -oL -eL "$INK_DIR/strata-inkling" --bench --native "$SQ10" --parallel 8 --prompt-len 64 --gen 32
          rm -f "$SQ10" "$INK_VIS"

          echo "== Live Inkling-2-Mini .gguf (UD-Q2_K_XL) loading check on Arc Pro B70 32 GB =="
          GGUF="$SANDBOX/Inkling-2-Mini-UD-Q2_K_XL.gguf"
          curl -fsSL --connect-timeout 20 --speed-limit 1 --speed-time 60 --retry 2 \
            "https://huggingface.co/unsloth/Inkling-2-Mini-GGUF/resolve/main/Inkling-2-Mini-UD-Q2_K_XL.gguf" \
            -o "$GGUF"
          ls -lh "$GGUF"
          "$INK_DIR/strata-inkling" --info "$GGUF" | tee "$SANDBOX/gguf.info"
          grep -q 'format=gguf' "$SANDBOX/gguf.info"
          set +e
          ONEAPI_DEVICE_SELECTOR=level_zero:gpu stdbuf -oL -eL "$INK_DIR/strata-inkling" --selfcheck --native "$GGUF"
          GGUF_GPU_RC=$?
          echo "--> strata-inkling GGUF GPU selfcheck rc=$GGUF_GPU_RC"
          if [ "$GGUF_GPU_RC" -ne 0 ]; then
            echo "--> Testing CPU fallback --selfcheck --cpu --native on GGUF"
            stdbuf -oL -eL "$INK_DIR/strata-inkling" --selfcheck --cpu --native "$GGUF"
            echo "--> strata-inkling GGUF CPU selfcheck rc=$?"
          fi
          set -e
          rm -f "$GGUF"

          echo "== Download live Hy4-Flash-Vision.strata (934 MB) & run B70 ViT GPU inference =="
          VIS="$SANDBOX/Hy4-Flash-Vision.strata"
          curl -fsSL --connect-timeout 20 --speed-limit 1 --speed-time 60 --retry 2 \
            "https://huggingface.co/strata-engine/Hy4-Flash-Strata/resolve/main/Hy4-Flash-Vision.strata" \
            -o "$VIS"
          ls -lh "$VIS"

          RGB="$SANDBOX/test224.rgb"
          python3 - <<PY
          data = bytes((i * 73 + 17) & 255 for i in range(224 * 224 * 3))
          open("$RGB", "wb").write(data)
          PY
          ONEAPI_DEVICE_SELECTOR=level_zero:gpu stdbuf -oL -eL "$BUILD/sy_vit_test" "$VIS" "$RGB" 224 224 "$SANDBOX/vit-out" 2
          python3 - <<PY
          import struct, math
          raw = open("$SANDBOX/vit-out/image_rows_gpu.npy", "rb").read()
          assert raw[:6] == b"\x93NUMPY"
          hl = struct.unpack("<H", raw[8:10])[0]
          vals = struct.unpack("<" + "f" * ((len(raw) - 10 - hl) // 4), raw[10 + hl:])
          assert len(vals) > 0 and all(math.isfinite(v) for v in vals), "non-finite ViT output!"
          norm = math.sqrt(sum(v * v for v in vals))
          print(f"Hy4-Flash-Vision B70 ViT output OK: {len(vals)} floats, L2={norm:.4f}")
          assert norm > 1.0, f"unexpected near-zero ViT output: L2={norm}"
          PY

      - name: Cleanup B70 scratch & Docker image
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/live-b70" "$RUNNER_TEMP/b70-build" || true
          docker rmi ghcr.io/niko1221/strata:0.2.19-sycl >/dev/null 2>&1 || true

  checks:
    name: Checks / ${{ matrix.name }}
    needs: [info, b70-gpu]
    if: ${{ !cancelled() && needs.info.result == 'success' && needs.b70-gpu.result == 'success' }}
    runs-on: [self-hosted, Linux, X64, Intel]
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --use-system-ca   # the JavaScript actions (checkout, upload-artifact) trust the machine's certificate store
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: cpu CMake preset, only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python terminal/serve/, only: py-serve }
          - { name: Python terminal/tools/, only: py-tools }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python venv (the machine's own python3; actions/setup-python cannot download through this network's proxy certificate)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" --version
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only "${{ matrix.only }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: intel-runner-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7
